name: Продление ключа Инстаграма

# Нужно только для старых ключей Instagram Login (живут 60 дней).
# Ключ «единого входа» Meta бессрочный, поэтому расписание выключено.
# Если когда-нибудь понадобится — верните блок schedule:
#   schedule:
#     - cron: "0 6 1,15 * *"
on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Продлить ключ и сохранить в секреты
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(python3 publisher/publish.py --refresh)
          echo "::add-mask::$NEW"
          gh secret set IG_TOKEN --repo "${{ github.repository }}" --body "$NEW"
          echo "Ключ продлён и сохранён." >> "$GITHUB_STEP_SUMMARY"
