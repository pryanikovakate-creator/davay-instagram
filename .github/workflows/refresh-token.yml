name: Продление ключа Инстаграма

# Ключ живёт 60 дней. Продлеваем 1-го и 15-го числа каждого месяца.
on:
  schedule:
    - cron: "0 6 1,15 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Продлить ключ и сохранить в секреты
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(python3 publisher/publish.py --refresh)
          echo "::add-mask::$NEW"
          gh secret set IG_TOKEN --repo "${{ github.repository }}" --body "$NEW"
          echo "Ключ продлён и сохранён." >> "$GITHUB_STEP_SUMMARY"
